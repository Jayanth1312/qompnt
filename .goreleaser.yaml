# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: qomp

before:
  hooks:
    - go mod tidy

builds:
  - id: qomp
    main: ./cmd/qomp
    binary: qomp
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: qomp
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - none*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"

release:
  github:
    owner: Jayanth1312
    name: qompnt
  name_template: "qomp {{.Tag}}"
  draft: false
  prerelease: auto
  header: |
    Installer CLI for [qompnt](https://qompnt.vercel.app).

    ```bash
    # download the archive for your OS from Assets, then:
    qomp init
    qomp add button
    ```

    Registry: `https://qompnt.vercel.app`
