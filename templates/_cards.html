{{define "cards"}}
<div id="cards" class="flex flex-col gap-6">
  {{range .Components}}
  <!-- The whole card navigates, via a link stretched behind it - but the preview
       is a live component, so .preview-inert (tokens.css) hands the pointer back
       to the controls inside it. Pressing a button there does the button's job,
       not the card's. The link is also a sibling, not a wrapper: a button inside
       an anchor is invalid HTML. -->
  <div class="gallery-card relative rounded-lg border border-border bg-background p-2">
    <a href="/c/{{.Slug}}" aria-label="{{.Name}}" class="absolute inset-0 rounded-lg"></a>

    <!-- Above the stretched link, so copying does not navigate. -->
    <button type="button" data-copy-src="/src/{{.Slug}}" aria-label="Copy {{.Name}} markup"
            class="absolute right-3 top-3 z-10 grid place-items-center rounded-md p-2 text-muted-foreground hover:bg-accent hover:text-foreground">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/>
      </svg>
    </button>

    <div class="preview-inert relative grid h-[280px] place-items-center overflow-hidden rounded-md bg-muted px-6 py-10">
      {{.Preview}}
    </div>
    <div class="pointer-events-none relative flex items-baseline justify-between px-3 pb-1 pt-3">
      <span class="text-body-sm font-500 text-foreground">{{.Name}}</span>
      <span class="text-body-sm text-muted-foreground/70">{{.CreatedLabel}}</span>
    </div>
  </div>
  {{else}}
  <p class="py-16 text-center text-body-sm text-muted-foreground/70">
    No components match{{if .Query}} “{{.Query}}”{{end}}.
  </p>
  {{end}}
</div>
{{end}}
