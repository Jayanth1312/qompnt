{{define "content"}}
<!-- Sticky, so the identity and the controls stay reachable down a long list.
     -mx-5 px-5 puts the background under the page gutters as well, or content
     scrolls up through the sides of the bar. -->
<header data-sticky-header class="sticky top-0 z-30 -mx-5 mb-8 flex items-center gap-1 px-5 py-3">
  <a href="/" class="mr-auto flex min-w-0 items-center gap-2 no-underline">
    {{template "mark" .}}
    <!-- Smaller on a phone: at 22px the wordmark and the count push the theme
         toggle off the row. -->
    <span class="font-display text-title-md text-foreground sm:text-title-lg">Qompnt</span>
    <!-- Counted from the same slice the cards render from, so it cannot drift
         from what is on the page - including when search filters it. -->
    <span data-card-count class="inline-grid h-5 min-w-5 shrink-0 place-items-center rounded-pill bg-secondary px-1.5 text-caption leading-none text-muted-foreground">{{len .Components}}</span>
  </a>

  {{template "dsswitch" .}}

  <!-- Search: a bare icon until it is clicked, then the field itself. Both halves
       are in the markup and [hidden] swaps which one shows, so it is instant and
       there is no second layout to maintain.

       On a phone the same button opens the command palette instead - a 224px
       field cannot open in a header that is already full, and the palette is the
       better small-screen answer anyway. One button, branched in the handler,
       rather than a second one hidden at every other width. -->
  <div data-search class="flex items-center">
    <button type="button" data-search-open aria-label="Search components"
            data-tip="Search · Ctrl K"
            class="tip tip-bottom grid place-items-center rounded-md px-control-x py-control-y text-muted-foreground hover:bg-accent hover:text-foreground">
      <i class="ph ph-magnifying-glass text-[18px]" aria-hidden="true"></i>
    </button>

    <div data-search-field hidden class="relative w-56">
      <i class="ph ph-magnifying-glass pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-[14px] text-muted-foreground/70" aria-hidden="true"></i>
      <input type="search" name="q" placeholder="Search components…"
             aria-label="Search components"
             autocomplete="off" data-search-input
             class="w-full rounded-md border border-border bg-background py-control-y pl-7 pr-7 text-body-sm leading-none text-foreground placeholder:text-muted-foreground/70 [&::-webkit-search-cancel-button]:hidden">
      <button type="button" data-search-clear aria-label="Clear search"
              class="absolute right-1.5 top-1/2 grid -translate-y-1/2 place-items-center rounded-xs p-0.5 text-muted-foreground hover:text-foreground">
        <i class="ph ph-x text-[13px]" aria-hidden="true"></i>
      </button>
    </div>
  </div>

  {{template "themetoggle" .}}
</header>

{{template "cards" .}}
{{end}}
