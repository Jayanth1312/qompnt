<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-cb]" data-opt-on="is-invalid">
  Error state
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-cb] [role=listbox]" data-opt-on="max-h-32">
  Short list
</label>

<label class="flex items-center gap-2">
  Placeholder
  <input type="text" placeholder="Search models…" data-opt-target="[data-x-cb] input[role=combobox]"
         class="w-40 rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground">
</label>
