<div data-x-cb data-combobox class="field relative w-full max-w-[280px]">
  <input type="text" role="combobox" aria-expanded="false" aria-autocomplete="list"
         placeholder="Search countries…" autocomplete="off"
         class="w-full rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground placeholder:text-muted-foreground/70">
  <input type="hidden" name="country" value="">

  <div role="listbox" hidden
       class="absolute left-0 right-0 top-[calc(100%+4px)] z-20 max-h-[104px] overflow-y-auto rounded-md border border-border bg-popover p-1 shadow-e2">
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">Argentina</button>
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">Australia</button>
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">Brazil</button>
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">Canada</button>
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">Denmark</button>
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">France</button>
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">Germany</button>
    <button type="button" role="option" aria-selected="false"
            class="flex w-full items-center rounded-sm px-row-x py-row-y text-left text-body-sm leading-none text-foreground hover:bg-accent">Japan</button>
    <p data-combobox-empty hidden class="px-row-x py-row-y text-body-sm text-muted-foreground">No match</p>
  </div>
</div>
