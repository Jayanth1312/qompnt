<div class="flex w-full max-w-[320px] flex-col gap-2">
  <div class="flex items-baseline justify-between">
    <label data-x-slider-label class="text-caption font-500 text-foreground">Temperature</label>
    <output data-x-out class="text-caption tabular-nums text-muted-foreground">0.7</output>
  </div>
  <input data-x-range type="range" class="slider" min="0" max="1" step="0.01" value="0.7" style="--p: 70"
         oninput="this.style.setProperty('--p', (this.value - this.min) / (this.max - this.min) * 100); this.parentElement.querySelector('output').value = (+this.value).toFixed(2)">
</div>
