<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-badge]"
         data-opt-on="bg-primary text-primary-foreground uppercase text-caption-up"
         data-opt-off="bg-accent text-foreground text-caption">
  Coral (NEW / BETA)
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-badge-dot]" data-opt-hide>
  Status dot
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-badge-x]" data-opt-hide>
  Removable
</label>

<label class="flex items-center gap-2">
  Label
  <input type="text" placeholder="Design" data-opt-target="[data-x-badge-label]"
         class="w-32 rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground placeholder:text-muted-foreground/70">
</label>
