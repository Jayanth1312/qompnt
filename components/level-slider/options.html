<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-level-range]" data-opt-on="level-knob">
  Round knob
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-ends]" data-opt-hide>
  End captions
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-level-range]" data-opt-on="slider-thick">
  Thick track
</label>
