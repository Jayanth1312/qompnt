<!-- A radio per step, so "which step am I on" is real form state that posts with
     the form rather than a class someone has to keep in sync. The CSS reads it:
       li:has(input:checked)       is the current step
       li:has(~ li input:checked)  is every step before it, therefore done
     That is what turns the tick on and paints the track behind you. Clicking a
     step selects it; no script anywhere. -->
<ol class="steps text-body-sm">
  <li>
    <label>
      <input type="radio" name="step" value="account" class="sr-only">
      <span class="dot">
        <span class="num">1</span>
        <svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
        <svg class="load spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
      </span>
      <span class="step-label">Account</span>
    </label>
  </li>
  <li>
    <label>
      <input type="radio" name="step" value="workspace" class="sr-only" checked>
      <span class="dot">
        <span class="num">2</span>
        <svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
        <svg class="load spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
      </span>
      <span class="step-label">Workspace</span>
    </label>
  </li>
  <li>
    <label>
      <input type="radio" name="step" value="invite" class="sr-only">
      <span class="dot">
        <span class="num">3</span>
        <svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg>
        <svg class="load spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
      </span>
      <span class="step-label">Invite</span>
    </label>
  </li>
</ol>

<!-- Vertical is the same list with one class. -->
<ol class="steps steps-vertical text-body-sm">
  <li>
    <label>
      <input type="radio" name="vstep" value="one" class="sr-only">
      <span class="dot"><span class="num">1</span>
        <svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></span>
      <span class="step-label">Account</span>
    </label>
  </li>
  <li>
    <label>
      <input type="radio" name="vstep" value="two" class="sr-only" checked>
      <span class="dot"><span class="num">2</span>
        <svg class="tick" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="m5 13 4 4L19 7"/></svg></span>
      <span class="step-label">Workspace</span>
    </label>
  </li>
</ol>
