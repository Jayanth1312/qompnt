<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-steps]" data-opt-on="steps-vertical">
  Vertical
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-step-label]" data-opt-hide>
  Labels
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-steps]" data-opt-on="steps-loading">
  Spinner on the current step
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-steps]" data-opt-on="steps-plain">
  No connecting line
</label>
