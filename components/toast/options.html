<label class="flex cursor-pointer items-center gap-2">
  <input type="radio" name="tone" value="success" checked class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-toast]" data-opt-on="tone-success">
  Success
</label>
<label class="flex cursor-pointer items-center gap-2">
  <input type="radio" name="tone" value="error" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-toast]" data-opt-on="tone-error">
  Error
</label>
<label class="flex cursor-pointer items-center gap-2">
  <input type="radio" name="tone" value="info" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-toast]" data-opt-on="tone-info">
  Info
</label>

<label class="flex items-center gap-2">
  Message
  <input type="text" placeholder="Changes saved" data-opt-target="[data-x-toast-msg]"
         class="w-56 rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground placeholder:text-muted-foreground/70">
</label>
