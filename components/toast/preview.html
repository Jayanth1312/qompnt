<div class="flex w-full max-w-[360px] flex-col items-center gap-5">
  <div data-x-toast class="tone-success flex w-full items-start gap-2 rounded-lg border px-control-x py-control-y shadow-e2">
    <svg data-tone-icon="success" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>
    </svg>
    <svg data-tone-icon="error" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
    </svg>
    <svg data-tone-icon="info" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/>
    </svg>
    <p data-x-toast-msg class="min-w-0 flex-1 text-body-sm leading-5">Changes saved</p>
    <button type="button" aria-label="Dismiss"
            class="mt-px grid shrink-0 place-items-center rounded-sm opacity-70 hover:opacity-100">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>

  <button type="button" hx-post="/demo/toast" hx-target="#toasts" hx-swap="afterbegin"
          hx-include="[data-options] input[name='tone']:checked"
          class="rounded-md bg-primary px-control-x py-control-y text-button font-500 text-primary-foreground hover:bg-primary/90">
    Raise a real one
  </button>
</div>
