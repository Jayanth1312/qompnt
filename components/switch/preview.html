<div class="flex w-full max-w-[280px] flex-col gap-5">
  <label class="flex cursor-pointer items-center justify-between gap-4 text-body-sm leading-none text-foreground">
    Wi-Fi
    <input type="checkbox" checked class="sr-only">
    <span data-x-sw class="toggle">
      <span class="toggle-knob">
        <svg data-x-sw-icon hidden data-toggle-on width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <svg data-x-sw-icon hidden data-toggle-off width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </span>
    </span>
  </label>

  <label class="flex cursor-pointer items-center justify-between gap-4 text-body-sm leading-none text-foreground">
    Airplane mode
    <input type="checkbox" class="sr-only">
    <span data-x-sw class="toggle">
      <span class="toggle-knob">
        <svg data-x-sw-icon hidden data-toggle-on width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20 6 9 17l-5-5"/>
        </svg>
        <svg data-x-sw-icon hidden data-toggle-off width="11" height="11" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
          <path d="M18 6 6 18M6 6l12 12"/>
        </svg>
      </span>
    </span>
  </label>

  <label data-x-sw-disabled hidden class="flex items-center justify-between gap-4 text-body-sm leading-none text-muted-foreground">
    Beta features
    <input type="checkbox" disabled class="sr-only">
    <span data-x-sw class="toggle">
      <span class="toggle-knob"></span>
    </span>
  </label>
</div>
