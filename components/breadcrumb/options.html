<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-crumbs]" data-opt-on="crumbs-slash">
  Slash separator
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-root]" data-opt-hide>
  Root link
</label>

<label class="flex items-center gap-2">
  Current
  <input type="text" placeholder="Breadcrumb" data-opt-target="[data-x-current]">
</label>
