     The last item is not a link - aria-current says you are already here. -->

    <li><a href="/c/button" class="rounded-sm no-underline hover:text-foreground">Components</a></li>
    <li><a href="/c/sidebar-nav" class="rounded-sm no-underline hover:text-foreground">Navigation</a></li>
    <li><span aria-current="page" class="font-500 text-foreground">Breadcrumb</span></li>
  </ol>
</nav>
