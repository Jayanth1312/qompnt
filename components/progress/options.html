<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-bar]" data-opt-on="is-indeterminate">
  Indeterminate
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-value]" data-opt-hide checked>
  Value label
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-bar]" data-opt-on="progress-thick">
  Thick
</label>
