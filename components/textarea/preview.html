<div class="flex w-full max-w-[380px] flex-col gap-1.5">
  <label data-x-ta-label class="text-caption font-500 text-foreground">Note <span class="text-muted-foreground/70">— it grows</span></label>
  <textarea rows="3" maxlength="280" placeholder="Say something considered."
            style="field-sizing: content"
            oninput="if (!CSS.supports('field-sizing','content')) { this.style.height='auto'; this.style.height=this.scrollHeight+'px' }
                     this.nextElementSibling.firstElementChild.textContent = this.value.length"
            class="min-h-[84px] max-h-[168px] resize-none rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground placeholder:text-muted-foreground/70"></textarea>
  <p data-x-count class="self-end text-caption text-muted-foreground/70"><span>0</span> / 280</p>
</div>
