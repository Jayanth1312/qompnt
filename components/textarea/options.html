<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="[data-x-count]" data-opt-hide>
  Character counter
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" class="h-4 w-4" style="accent-color: var(--primary)"
         data-opt-target="textarea" data-opt-on="border-destructive" data-opt-off="border-border">
  Error state
</label>

<label class="flex items-center gap-2">
  Label
  <input type="text" placeholder="Note" data-opt-target="[data-x-ta-label]"
         class="w-32 rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground placeholder:text-muted-foreground/70">
</label>
