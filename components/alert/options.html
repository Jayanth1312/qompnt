<label class="flex cursor-pointer items-center gap-2">
  <input type="radio" name="tone" data-opt-target="[data-x-alert]" data-opt-on="tone-success">
  Success
</label>
<label class="flex cursor-pointer items-center gap-2">
  <input type="radio" name="tone" checked data-opt-target="[data-x-alert]" data-opt-on="tone-error">
  Error
</label>
<label class="flex cursor-pointer items-center gap-2">
  <input type="radio" name="tone" data-opt-target="[data-x-alert]" data-opt-on="tone-info">
  Info
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-alert-body]" data-opt-hide>
  Description
</label>

<label class="flex items-center gap-2">
  Title
  <input type="text" placeholder="Payment failed" data-opt-target="[data-x-alert-title]">
</label>
