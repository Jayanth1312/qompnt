<div data-x-alert role="alert" class="tone-error flex w-full max-w-[380px] items-start gap-2 rounded-lg border px-control-x py-control-y">
  <svg data-tone-icon="success" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><path d="m8 12 2.5 2.5L16 9"/>
  </svg>
  <svg data-tone-icon="error" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
  </svg>
  <svg data-tone-icon="info" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/>
  </svg>
  <div class="min-w-0 flex-1">
    <p data-x-alert-title class="text-body-sm font-500 leading-5">Payment failed</p>
    <p data-x-alert-body class="mt-1 text-body-sm leading-5 opacity-80">
      Your card was declined. Try another card or contact your bank.
    </p>
  </div>
</div>
