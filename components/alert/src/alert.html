<!-- Inline callout. The tone class carries surface, text, border and which icon
     shows - the same three classes the Toast uses, so the two agree by
     construction rather than by copy-paste. -->
<div role="alert" class="tone-error flex items-start gap-2 rounded-lg border px-control-x py-control-y">
  <svg data-tone-icon="error" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><path d="m9 9 6 6M15 9l-6 6"/>
  </svg>
  <div class="min-w-0 flex-1">
    <p class="text-body-sm font-500 leading-5">Payment failed</p>
    <p class="mt-1 text-body-sm leading-5 opacity-80">
      Your card was declined. Try another card or contact your bank.
    </p>
  </div>
</div>

<!-- Single line, no title. -->
<div class="tone-info flex items-start gap-2 rounded-lg border px-control-x py-control-y">
  <svg data-tone-icon="info" class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/>
  </svg>
  <p class="min-w-0 flex-1 text-body-sm leading-5">Three components were updated.</p>
</div>

<!-- Neutral: no tone class, so it takes the page surface. Use it for notes that
     are not good or bad news. -->
<div class="flex items-start gap-2 rounded-lg border border-border bg-muted px-control-x py-control-y text-foreground">
  <svg class="mt-px shrink-0" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="9"/><path d="M12 11v5"/><path d="M12 7.5v.5"/>
  </svg>
  <p class="min-w-0 flex-1 text-body-sm leading-5">This workspace is on the free plan.</p>
</div>
