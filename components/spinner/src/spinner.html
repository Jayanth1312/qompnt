<!-- Decorative: the SVG is hidden from assistive tech and the words carry the
     meaning. -->
<span class="inline-flex items-center gap-2 text-body-sm text-muted-foreground">
  <svg class="spin shrink-0" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" aria-hidden="true">
    <path d="M12 3a9 9 0 1 0 9 9"/>
  </svg>
  Checking availability…
</span>

<!-- Three sizes, no size prop: it is an SVG, so width and height are the API. -->
<svg class="spin text-primary" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
<svg class="spin text-primary" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
<svg class="spin text-primary" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
     stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>

<!-- In a button: .indicator is invisible until htmx adds .htmx-request to the
     button, which lasts exactly as long as the request. -->
<button class="inline-flex items-center gap-2 rounded-md bg-primary px-control-x py-control-y text-button font-500 text-primary-foreground hover:bg-primary/90"
        hx-post="/demo/echo" hx-swap="none">
  <svg class="indicator spin" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="2.5" stroke-linecap="round" aria-hidden="true"><path d="M12 3a9 9 0 1 0 9 9"/></svg>
  Save
</button>
