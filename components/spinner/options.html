<label class="flex items-center gap-2">
  Size
  <input type="range" min="0" max="2" step="1" value="2"
         data-opt-target="[data-x-spinner]" data-opt-values="w-4 h-4|w-5 h-5|w-7 h-7">
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-label]" data-opt-hide>
  Label
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-spinner]" data-opt-on="text-muted-foreground" data-opt-off="text-primary">
  Muted
</label>
