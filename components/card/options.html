<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-card-cover]" data-opt-hide>
  Cover
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-card-action]" data-opt-hide>
  Action
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-card]" data-opt-on="border-0 shadow-e2" data-opt-off="border border-border">
  Elevated (no border)
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-card-body]" data-opt-on="p-3" data-opt-off="p-card">
  Tight padding
</label>

<label class="flex items-center gap-2">
  Title
  <input type="text" placeholder="Card title" data-opt-target="[data-x-card-title]">
</label>
