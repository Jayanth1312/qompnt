<div class="flex w-full max-w-[320px] flex-col gap-5">
  <div data-x-field class="field flex flex-col gap-1.5">
    <label class="text-caption font-500 text-foreground">Email</label>
    <input data-x-input type="email" placeholder="you@example.com" required aria-describedby="email-error"
           class="opacity-100 rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground placeholder:text-muted-foreground/70">
    <p class="field-error text-caption" id="email-error">Enter an email address, like you@example.com.</p>
    <p class="field-hint text-caption text-muted-foreground">We only use this for sign-in.</p>
  </div>

</div>
