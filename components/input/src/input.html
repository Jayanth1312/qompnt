<!-- Field: label, input, hint. 40px tall, 8px radius, hairline border.
     The coral focus ring comes from tokens.css, not a utility class. -->
<div class="flex flex-col gap-1.5">
  <label for="email" class="text-caption font-500 text-foreground">Email</label>
  <input id="email" name="email" type="email" placeholder="you@example.com"
         class="rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground
                placeholder:text-muted-foreground/70">
</div>

<!-- Error state: border and message shift to the error tone. -->
<div class="flex flex-col gap-1.5">
  <label for="email-bad" class="text-caption font-500 text-foreground">Email</label>
  <input id="email-bad" type="email" value="not-an-email" aria-invalid="true"
         class="rounded-md border border-destructive bg-background px-control-x py-control-y text-body-sm leading-none text-foreground">
  <p class="text-caption text-destructive">That doesn't look like an email address.</p>
</div>

<!-- Expanding search - the one this site's header uses. A bare icon button until
     it is clicked, then the field. Both halves are in the markup and [hidden]
     swaps which one shows: instant, no animation, one layout.
     ::-webkit-search-cancel-button is hidden because the clear button is ours. -->
<div data-search class="flex items-center">
  <button type="button" data-search-open aria-label="Search"
          class="grid place-items-center rounded-md px-control-x py-control-y text-muted-foreground hover:bg-accent hover:text-foreground">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
  </button>

  <div data-search-field hidden class="relative w-56">
    <svg class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-muted-foreground/70"
         width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
         stroke-linecap="round" aria-hidden="true">
      <circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>
    </svg>
    <input type="search" name="q" placeholder="Search components…" aria-label="Search" autocomplete="off"
           class="w-full rounded-md border border-border bg-background py-control-y pl-7 pr-7 text-body-sm leading-none
                  text-foreground placeholder:text-muted-foreground/70 [&::-webkit-search-cancel-button]:hidden">
    <button type="button" data-search-clear aria-label="Clear search"
            class="absolute right-1.5 top-1/2 grid -translate-y-1/2 place-items-center rounded-xs p-0.5 text-muted-foreground hover:text-foreground">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
           stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
    </button>
  </div>
</div>

<script>
if (!window.__qompntSearch) {
  window.__qompntSearch = true;
  document.addEventListener('click', (e) => {
    const open = e.target.closest('[data-search-open]');
    if (open) {
      const box = open.closest('[data-search]');
      open.hidden = true;
      const field = box.querySelector('[data-search-field]');
      field.hidden = false;
      field.querySelector('input').focus();
      return;
    }
    const clear = e.target.closest('[data-search-clear]');
    if (clear) {
      const box = clear.closest('[data-search]');
      const input = box.querySelector('input[type="search"]');
      input.value = '';
      // Fires the `search` event, which is what hx-trigger listens for.
      input.dispatchEvent(new Event('search'));
      box.querySelector('[data-search-field]').hidden = true;
      box.querySelector('[data-search-open]').hidden = false;
    }
  });
}
</script>

<!-- Server-validated: the server owns the verdict and returns this whole field
     back, so the rule lives in one place instead of being duplicated in JS. -->
<div id="username-field" class="flex flex-col gap-1.5">
  <label for="username" class="text-caption font-500 text-foreground">Username</label>
  <input id="username" name="username" placeholder="lowercase, 3+ characters"
         class="rounded-md border border-border bg-background px-control-x py-control-y text-body-sm leading-none text-foreground
                placeholder:text-muted-foreground/70"
         hx-post="/demo/input/validate"
         hx-trigger="input changed delay:400ms"
         hx-target="#username-field"
         hx-swap="outerHTML">
</div>
