<label class="flex cursor-pointer items-center gap-2">

  Zebra rows
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-table]" data-opt-on="tbl-rules">
  Row rules
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-table]" data-opt-on="tbl-hover">
  Hover highlight
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-head]" data-opt-hide>
  Header row
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" data-opt-target="[data-x-wrap]" data-opt-on="border-0" data-opt-off="border border-border">
  Frameless
</label>
