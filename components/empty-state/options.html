<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-empty]" data-opt-on="rounded-lg border border-dashed border-border">
  Dashed frame
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-empty-icon]" data-opt-hide>
  Icon
</label>

<label class="flex cursor-pointer items-center gap-2">
  <input type="checkbox" checked data-opt-target="[data-x-empty-action]" data-opt-hide>
  Action
</label>

<label class="flex items-center gap-2">
  Title
  <input type="text" placeholder="No components yet" data-opt-target="[data-x-empty-title]">
</label>
